<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Shelf · Book recommendations</title>
  <meta name="description" content="Books I'm reading, books I've read, and the ones I recommend.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23E60023'/><path d='M10 9.5c2.4-.9 4.4-.6 6 .9 1.6-1.5 3.6-1.8 6-.9V22c-2.4-.9-4.4-.6-6 .9-1.6-1.5-3.6-1.8-6-.9z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      var t = localStorage.getItem("shelf-theme");
      if (t) document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#filters">Skip to the books</a>

  <header class="topbar">
    <div class="topbar__row">
      <a class="logo" href="./" aria-label="Home">
        <span class="logo__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M10 9.5c2.4-.9 4.4-.6 6 .9 1.6-1.5 3.6-1.8 6-.9V22c-2.4-.9-4.4-.6-6 .9-1.6-1.5-3.6-1.8-6-.9z"/></svg>
        </span>
        <span class="logo__name"><span data-owner>My</span> Shelf</span>
      </a>

      <label class="search">
        <span class="visually-hidden">Search title or author</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input type="search" placeholder="Search books, authors, series" data-search autocomplete="off">
      </label>

      <button class="icon-btn theme-toggle" type="button" aria-label="Switch colour theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__inner">
        <div class="hero__text">
          <h1 id="hero-title" class="hero__title">Books worth<br> your evenings</h1>
          <p class="hero__sub" data-tagline></p>
          <div class="hero__actions">
            <a class="btn btn--primary" href="#filters" data-browse>Browse the shelf</a>
            <button class="btn btn--secondary" type="button" data-surprise>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3"/><circle cx="15.5" cy="15.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/></svg>
              Surprise me
            </button>
          </div>
          <p class="hero__facts">
            <span><strong data-stat="total">0</strong> books</span>
            <span><strong data-stat="authors">0</strong> authors</span>
            <span><strong data-stat="genres">0</strong> genres</span>
            <span><strong data-stat="series">0</strong> series</span>
          </p>
        </div>
        <div class="collage" data-collage role="group" aria-label="A few covers from the shelf"></div>
      </div>
    </section>

    <section class="filters" id="filters" aria-label="Filter books">
      <div class="filters__inner">
        <div class="genres">
          <button class="genres__arrow genres__arrow--prev" type="button" aria-label="Scroll genres left" data-scroll="-1" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <div class="genres__track" role="group" aria-label="Genres (pick one or more)" data-genres></div>
          <button class="genres__arrow genres__arrow--next" type="button" aria-label="Scroll genres right" data-scroll="1" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
        <label class="sort">
          <span class="visually-hidden">Sort books</span>
          <select data-sort>
            <option value="recent">Most recent</option>
            <option value="rating">Highest rated</option>
            <option value="title">Title A–Z</option>
            <option value="author">Author A–Z</option>
            <option value="series">Series order</option>
          </select>
        </label>
      </div>
    </section>

    <section id="feed" class="feed" aria-labelledby="feed-title">
      <div class="feed__head">
        <div>
          <h2 id="feed-title" data-feed-title>Everything on the shelf</h2>
          <p class="feed__count" data-feed-count aria-live="polite"></p>
        </div>
        <div class="active" data-active></div>
      </div>
      <div class="masonry" data-masonry role="list"></div>
      <div class="sentinel" data-sentinel aria-hidden="true"></div>
      <div class="empty" data-empty hidden><p>No books match these filters.</p><button class="btn btn--secondary" type="button" data-clear>Clear filters</button></div>
    </section>
  </main>

  <footer class="footer">
    <p>Kept by <span data-owner-plain>me</span>, one book at a time.</p>
    <p>Reading log through <span data-updated></span></p>
  </footer>

  <dialog class="closeup" data-sheet aria-labelledby="closeup-title">
    <div class="closeup__inner" data-sheet-body></div>
  </dialog>

  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
